name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: instructor_test
          POSTGRES_PASSWORD: instructor_test
          POSTGRES_DB: instructor_scheduling_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U instructor_test -d instructor_scheduling_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: instructor_scheduling_test
      DB_USER: instructor_test
      DB_PASSWORD: instructor_test
      JWT_SECRET: test-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix backend ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm --prefix backend test -- --runInBand
      - run: CI=true npm --prefix frontend test -- --watchAll=false
